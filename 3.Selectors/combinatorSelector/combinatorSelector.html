<body>
    <h2>Child Selector</h2>
    <p>The child selector(>) selects all element that are the children of a specific element.</p>
    <div>
        <p>Paragraph 1 in the div.</p> 
        <p>Paragraph 2 in the div.</p>
    </div>
    <section>
        <div>
            Paragraph 3 in the div(inside a section element).
        </div>
    </section>
    <div >
    <p>Paragraph 4 in the div.</p>
    </div>
    <p style="color: blue; background-color:  darkmagenta;"> Paragraph 5 Not in a div.</p>
    <p style="color: blue;">Paragraph 6. Not in a div.</p>
