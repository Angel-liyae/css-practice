<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .class{
            text-align: center;
            color: green;
        }
         p::before{
            font-size:x-large;
            content:"Content"; 
            color: red;
            }
    </style>
</head>
<body>
    <div class="class">
         <h1>Pseudo Element Selector</h1> 
         <h2>::before element</h2>
         <p>This is a paragraph to which we added 'Content' in red color using ::before element.</p>
    </div>
</body>
</html>
