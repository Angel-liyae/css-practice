<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .a{
            border: thick solid black;
            background-color: skyblue;
            width: 180px;
            height: 75px;
            padding: 10px 10px 10px 10px;
        }
    </style>
</head>
<body>
    <div class="a">
        <p>
            This is a box with padding and a border.
        </p>
    </div>
</body>
</html>
